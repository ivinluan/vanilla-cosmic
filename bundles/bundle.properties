block.vanilla-cosmic-pulsar-liquid-pump.name = Pulsar Liquid Pump
block.vanilla-cosmic-pulsar-liquid-pump.description = Harnesses the rhythmic energy of a pulsar to extract liquids at remarkable speeds.

block.vanilla-cosmic-quasar-liquid-pump.name = Quasar Liquid Pump
block.vanilla-cosmic-quasar-liquid-pump.description = A colossal pump powered by quasar energy, capable of drawing vast quantities of liquid from the depths.

# conduit
block.vanilla-cosmic-solar-conduit.name = Solar Conduit
block.vanilla-cosmic-solar-conduit.description = Channels liquids through radiant solar pathways, ensuring steady and efficient transport.

block.vanilla-cosmic-supernova-conduit.name = Supernova Conduit
block.vanilla-cosmic-supernova-conduit.description = Infused with the explosive power of a dying star, allowing liquids to flow at extraordinary speeds.

block.vanilla-cosmic-void-conduit.name = Void Conduit
block.vanilla-cosmic-void-conduit.description = Utilizes the silence of the cosmic void to transport liquids across great distances with minimal resistance.

