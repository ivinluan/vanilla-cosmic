#bundle ph

# blocks
# production
# drill
block.vanilla-cosmic-cosmic-i-drill.name = Cosmic Drill
block.vanilla-cosmic-cosmic-i-drill.description = Kilala rin bilang Cosmic I Drill. Ang unang bersyon ng drill mula sa KALAWAKAN. Mas pina-ganda gamit ang titanium, ito ay mas mainam kaysa sa pneumatic drill.

block.vanilla-cosmic-cosmic-i-drill-mini.name = mini Cosmic Drill
block.vanilla-cosmic-cosmic-i-drill-mini.description = Kilala rin bilang mini Cosmic I Drill. Ang maliit na bersyon ng Cosmic I Drill.

block.vanilla-cosmic-cosmic-ii-drill.name = Cosmic II Drill
block.vanilla-cosmic-cosmic-ii-drill.description = Ang pangalawang bersyon ng drill mula sa KALAWAKAN. Mas pinatibay gamit ang plastanium, ito ay mas malakas kaysa sa Cosmic I Drill.

block.vanilla-cosmic-cosmic-ii-drill-mini.name = mini Cosmic II Drill
block.vanilla-cosmic-cosmic-ii-drill-mini.description = Ang maliit na bersyon ng Cosmic II Drill.

block.vanilla-cosmic-cosmic-iii-drill.name = Cosmic III Drill
block.vanilla-cosmic-cosmic-iii-drill.description = Ang pangatlong bersyon ng drill mula sa KALAWAKAN. Mas pina-ganda gamit ang thorium, ito ay mas mainam kaysa sa Cosmic II Drill.

block.vanilla-cosmic-cosmic-iii-drill-mini.name = mini Cosmic III Drill
block.vanilla-cosmic-cosmic-iii-drill-mini.description = Ang maliit na bersyon ng Cosmic III Drill.

block.vanilla-cosmic-cosmic-iv-drill.name = Cosmic IV Drill
block.vanilla-cosmic-cosmic-iv-drill.description = Ang pang-apat na bersyon ng drill mula sa KALAWAKAN. Mas pinatibay gamit ang phase fabric, ito ay mas malakas kaysa sa Cosmic III Drill.

block.vanilla-cosmic-cosmic-iv-drill-mini.name = mini Cosmic IV Drill
block.vanilla-cosmic-cosmic-iv-drill-mini.description = Ang maliit na bersyon ng Cosmic IV Drill.

block.vanilla-cosmic-cosmic-v-drill.name = Cosmic V Drill
block.vanilla-cosmic-cosmic-v-drill.description = Ang pang-limang bersyon ng drill mula sa KALAWAKAN. Mas pina-ganda gamit ang beryllium, ito ay mas mainam kaysa sa Cosmic IV Drill.

block.vanilla-cosmic-cosmic-v-drill-mini.name = mini Cosmic V Drill
block.vanilla-cosmic-cosmic-v-drill-mini.description = Ang maliit na bersyon ng Cosmic V Drill.

block.vanilla-cosmic-cosmic-vi-drill.name = Cosmic VI Drill
block.vanilla-cosmic-cosmic-vi-drill.description = Ang pang-anim na bersyon ng drill mula sa KALAWAKAN. Mas pinatibay gamit ang surge alloy, ito ay mas malakas kaysa sa Cosmic V Drill.

block.vanilla-cosmic-cosmic-vi-drill-mini.name = mini Cosmic VI Drill
block.vanilla-cosmic-cosmic-vi-drill-mini.description = Ang maliit na bersyon ng Cosmic VI Drill.

block.vanilla-cosmic-cosmic-vii-drill.name = Cosmic VII Drill
block.vanilla-cosmic-cosmic-vii-drill.description = Ang pang-pitong bersyon ng drill mula sa KALAWAKAN. Mas pina-ganda gamit ang tungsten, ito ay mas mainam kaysa sa Cosmic VI Drill.

block.vanilla-cosmic-cosmic-vii-drill-mini.name = mini Cosmic VII Drill
block.vanilla-cosmic-cosmic-vii-drill-mini.description = Ang maliit na bersyon ng Cosmic VII Drill.

block.vanilla-cosmic-cosmic-viii-drill.name = Cosmic VIII Drill
block.vanilla-cosmic-cosmic-viii-drill.description = Ang pang-walong bersyon ng drill mula sa KALAWAKAN. Mas pinatibay gamit ang carbide, ito ay mas malakas kaysa sa Cosmic VII Drill.

block.vanilla-cosmic-cosmic-viii-drill-mini.name = mini Cosmic VIII Drill
block.vanilla-cosmic-cosmic-viii-drill-mini.description = Ang maliit na bersyon ng Cosmic VIII Drill.

block.vanilla-cosmic-cosmic-drill-pro.name = Cosmic Drill Pro
block.vanilla-cosmic-cosmic-drill-pro.description = Ang Pro na bersyon ng Cosmic Drill. Mayroon itong mas mataas na kapasidad at mas mabilis na bilis ng pagmimina kaysa sa mga naunang bersyon ng Cosmic Drill. Gumagamit ito ng cryofluid upang higit pang mapabilis ang pagkuha ng mga mineral.

block.vanilla-cosmic-cosmic-drill-pro-max.name = Cosmic Drill Pro Max
block.vanilla-cosmic-cosmic-drill-pro-max.description = Ito ang pinakamahusay na drill sa buong KALAWAKAN, na nakahihigit sa lahat ng iba pang drill. Gumagamit ito ng cryofluid upang higit pang mapabilis ang pagmimina at maabot ang sukdulang kahusayan sa pagkuha ng mga mineral.

# beamdrill
block.vanilla-cosmic-cosmic-prism-bore.name = Cosmic Prism Bore
block.vanilla-cosmic-cosmic-prism-bore.description = Itinututok nito ang liwanag sa isang kumplikadong prisma, na naghahati rito sa maraming makapangyarihang sinag. Kaya nitong baluktutin at ituon ang enerhiya nang may matinding katumpakan, na nagbibigay ng pambihirang lakas at presisyon. Dahil sa natatangi nitong disenyo, nakakamit nito ang pinakamataas na kahusayan sa pagbabarena ng mga pader ng mineral.

block.vanilla-cosmic-cosmic-radiant-bore.name = Cosmic Radiant Bore
block.vanilla-cosmic-cosmic-radiant-bore.description = Naglalabas ito ng matindi at nakakasilaw na enerhiya na kayang mag-disintegrate ng anumang nasa harapan nito. Ang nagniningning nitong liwanag ay isang puwersang dapat katakutan, na kayang maghukay sa mga pader ng mineral gamit lamang ang dalisay na kapangyarihan ng liwanag.

block.vanilla-cosmic-cosmic-spectral-bore.name = Cosmic Spectral Bore
block.vanilla-cosmic-cosmic-spectral-bore.description = Kinokontrol nito ang buong spectrum ng liwanag, na nagbibigay-daan upang tumagos sa mga pader ng mineral sa pamamagitan ng tumpak na pag-aayos ng enerhiya nito. Ang kakayahan nitong umangkop sa iba't ibang wavelength ang susi sa pambihirang talino at kapangyarihan nito.

block.vanilla-cosmic-cosmic-photon-bore.name = Cosmic Photon Bore
block.vanilla-cosmic-cosmic-photon-bore.description = Pinapagana ng dalisay na kapangyarihan ng mga photon, ang mga pangunahing partikulo ng liwanag. Sa pamamagitan ng lubos na nakatuong sinag ng enerhiya, kaya nitong tagusin ang anumang pader ng mineral nang may walang kapantay na bilis at katumpakan. Ang bore na ito ay kumakatawan sa rurok ng makabagong teknolohiya, na kumukuha ng pinakadalisay na anyo ng enerhiya mula sa buong KALAWAKAN.

# burstdrill
block.vanilla-cosmic-supernova-drill.name = Supernova Drill
block.vanilla-cosmic-supernova-drill.description = Pinapagana ng naglalagablab na kapangyarihan ng isang bituin, naglalabas ito ng matitinding pagsabog ng enerhiya upang mabilis na mahukay kahit ang pinakamatitigas na ore. Tinagurian bilang pinakamalakas na drill sa buong KALAWAKAN, ang walang kapantay nitong puwersa ay nagbibigay-daan sa napakabilis at napakahusay na pagmimina.

# wallcrafter
block.vanilla-cosmic-titanium-rift-fracturer.name = Titanium Rift Fracturer
block.vanilla-cosmic-titanium-rift-fracturer.description = Gumagamit ito ng mga dimensional rift upang durugin ang mga banging mayaman sa titanium at mahusay na makuha ang mahahalagang mineral nito.

block.vanilla-cosmic-thorium-rift-fracturer.name = Thorium Rift Fracturer
block.vanilla-cosmic-thorium-rift-fracturer.description = Gumagamit ito ng mga dimensional rift upang durugin ang mga banging mayaman sa thorium at kunin ang radioactive na mineral mula sa kailaliman ng mga ito.

block.vanilla-cosmic-beryllium-rift-fracturer.name = Beryllium Rift Fracturer
block.vanilla-cosmic-beryllium-rift-fracturer.description = Gumagamit ito ng enerhiya mula sa ibang dimensyon upang durugin ang mga banging mayaman sa beryllium at mahusay na makuha ang mahahalagang deposito nito.

block.vanilla-cosmic-tungsten-rift-fracturer.name = Tungsten Rift Fracturer
block.vanilla-cosmic-tungsten-rift-fracturer.description = Gumagamit ito ng makapangyarihang mga dimensional rift upang durugin ang mga banging mayaman sa tungsten at makuha ang matibay na mineral na nakabaon sa kanilang kailaliman.

# distribution
# conveyor
block.vanilla-cosmic-solar-conveyor.name = Solar Conveyor
block.vanilla-cosmic-solar-conveyor.description = Pinapagana ng enerhiyang nagmumula sa buong Sistema ng Araw, mahusay nitong inililipat ang mga ore nang may pambihirang bilis at katumpakan.

block.vanilla-cosmic-supernova-conveyor.name = Supernova Conveyor
block.vanilla-cosmic-supernova-conveyor.description = Gamit ang sumasabog na kapangyarihan ng isang bituin, naitutulak nito ang mga ore sa napakabilis na bilis.

block.vanilla-cosmic-void-conveyor.name = Void Conveyor
block.vanilla-cosmic-void-conveyor.description =  Ginagamit nito ang enerhiya ng kosmikong kawalan upang baluktutin ang mismong espasyo, na nagbibigay-daan sa agarang paglilipat ng mga ore sa napakalalayong distansya.

# router
block.vanilla-cosmic-cosmic-router.name = Cosmic Router
block.vanilla-cosmic-cosmic-router.description = Dinadaluyan nito ang mga item sa mga landas na pinapagana ng kosmikong enerhiya, na nagbibigay-daan sa mabilis at mahusay na pamamahagi ng mga ito sa mga konektadong istruktura.

# junction
block.vanilla-cosmic-cosmic-junction.name = Cosmic Junction
block.vanilla-cosmic-cosmic-junction.description = Gumagamit ito ng kosmikong enerhiya upang mabilis na maihatid ang mga nagsasalubong na daloy ng mga item nang hindi naghahalo o nagkakagulo ang mga ito.

# bridge
block.vanilla-cosmic-celestial-bridge.name = Celestial Bridge
block.vanilla-cosmic-celestial-bridge.description = Dinadala nito ang mga item sa malalayong distansya sa pamamagitan ng mga selestiyal na daanan, na nagpapanatili ng mabilis at maaasahang transportasyon nang hindi nangangailangan ng kuryente.

block.vanilla-cosmic-interstellar-hyperlane.name = Interstellar Hyperlane
block.vanilla-cosmic-interstellar-hyperlane.description = Gumagamit ito ng kosmikong enerhiya upang mabilis na maihatid ang mga item sa mga interstellar na daanan, na nagbibigay-daan sa transportasyon sa napakalalayong distansya nang may pambihirang bilis at kahusayan.

# stackconveyor
block.vanilla-cosmic-stellar-stack-conveyor.name = Stellar Stack Conveyor
block.vanilla-cosmic-stellar-stack-conveyor.description = Gumagamit ito ng enerhiya mula sa mga bituin upang mabilis na makapaghatid ng malalaking bunton ng mga gamit, kaya nakatutulong ito sa mahusay na pagbibiyahe ng maraming item.

# stackrouter
block.vanilla-cosmic-stellar-stack-router.name = Stellar Stack Router
block.vanilla-cosmic-stellar-stack-router.description = Dinadala ang malalaking bunton ng mga gamit sa mga landas na may enerhiya mula sa mga bituin, at mabilis na ipinapamahagi ang mga ito sa mga nakakonektang sistema ng transportasyon.

# massdriver
block.vanilla-cosmic-quasar-mass-driver.name = Quasar Mass Driver
block.vanilla-cosmic-quasar-mass-driver.description = Gumagamit ito ng napakatinding enerhiya ng isang quasar para mabilis na maipadala ang malalaking kargamento sa napakalalayong distansya.

# defense
block.vanilla-cosmic-event-horizon-wall.name = Event Horizon Wall
block.vanilla-cosmic-event-horizon-wall.description = Isang makabagong depensibong pader na sumisipsip ng mga laser, sumasalamin sa mga papasok na projectile, gumaganti gamit ang kidlat, at lumilikha ng nagbabalik na kalasag. Nangangailangan ng kuryente ang kalasag.

block.vanilla-cosmic-event-horizon-wall-large.name = Large Event Horizon Wall
block.vanilla-cosmic-event-horizon-wall-large.description = Isang mas malaking Event Horizon Wall na may mas mataas na tibay ng estruktura, kapasidad ng kalasag, at bilis ng pagbabalik nito.

block.vanilla-cosmic-event-horizon-wall-colossal.name = Colossal Event Horizon Wall
block.vanilla-cosmic-event-horizon-wall-colossal.description = Isang napakalaking selestiyal na kuta na may pambihirang tibay, makapangyarihang kalasag, pagsalamin ng projectile, pagsipsip ng laser, at malayuang pagganti gamit ang kidlat.

# liquid
# pump
block.vanilla-cosmic-pulsar-liquid-pump.name = Pulsar Liquid Pump
block.vanilla-cosmic-pulsar-liquid-pump.description = Ginagamit ang ritmikong enerhiya ng isang pulsar upang magbomba ng mga likido sa kahanga-hangang bilis.

block.vanilla-cosmic-quasar-liquid-pump.name = Quasar Liquid Pump
block.vanilla-cosmic-quasar-liquid-pump.description = Isang napakalakas na bomba na pinapagana ng enerhiya ng quasar, kayang sumipsip ng napakalaking dami ng likido mula sa kailaliman.

# liquid storage
block.vanilla-cosmic-celestial-reservoir.name = Celestial Reservoir
block.vanilla-cosmic-celestial-reservoir.description = Nag-iimbak ng napakaraming likido sa loob ng isang pinatibay na selestiyal na estrukturang imbakan.

# conduit
block.vanilla-cosmic-solar-conduit.name = Solar Conduit
block.vanilla-cosmic-solar-conduit.description = Dinadaluyan ang mga likido sa nagliliwanag na landas ng araw upang matiyak ang matatag at episyenteng transportasyon.

block.vanilla-cosmic-supernova-conduit.name = Supernova Conduit
block.vanilla-cosmic-supernova-conduit.description = Pinapadaloy ng lakas ng isang sumasabog na bituin ang mga likido sa pambihirang bilis.

block.vanilla-cosmic-void-conduit.name = Void Conduit
block.vanilla-cosmic-void-conduit.description = Ginagamit ang katahimikan ng kosmikong kawalan upang maghatid ng mga likido sa malalayong distansya nang halos walang hadlang.

# router
block.vanilla-cosmic-cosmic-liquid-router.name = Cosmic Liquid Router
block.vanilla-cosmic-cosmic-liquid-router.description = Gumagabay sa mga daloy ng likido sa mga kosmikong daanan at ipinapamahagi ang mga ito sa mga konektadong istruktura.

# junction
block.vanilla-cosmic-cosmic-liquid-junction.name = Cosmic Liquid Junction
block.vanilla-cosmic-cosmic-liquid-junction.description = Hinahayaan ang maraming daanan ng likido na magkrus nang hindi nagkakagulo, pinananatili ang tuloy-tuloy na daloy.

# liquid bridge
block.vanilla-cosmic-celestial-aqueduct.name = Celestial Aqueduct
block.vanilla-cosmic-celestial-aqueduct.description = Dinadala ang mga likido sa pamamagitan ng selestiyal na agos, na nagbibigay-daan sa mabilis na transportasyon sa malalayong distansya nang walang kuryente.

block.vanilla-cosmic-voidstream-hyperlane.name = Voidstream Hyperlane
block.vanilla-cosmic-voidstream-hyperlane.description = Nagbubukas ng matatag na lagusan sa kosmikong kawalan upang agad na maihatid ang mga likido sa napakalalayong distansya.
